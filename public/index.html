<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monthly Planner Journal</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>Your Planner</h1>
        </div>
        <nav class="tabs" aria-label="Planner sections">
          <button class="tab is-active" type="button" data-view="calendar">Calendar</button>
          <button class="tab" type="button" data-view="goals">Goals</button>
        </nav>
        <div class="section-meta-controls">
          <button class="undo-button" type="button" id="undoButton" disabled>Undo</button>
          <details class="palette-control color-menu" id="paletteMenu">
            <summary aria-label="Choose planner color">
              <span class="color-menu-current" aria-hidden="true"></span>
            </summary>
            <div class="color-menu-items" id="paletteOptions"></div>
          </details>
          <details class="ai-access-control">
            <summary class="metadata-button">AI access</summary>
            <div class="ai-access-panel">
              <label for="aiAccessToken">Access key</label>
              <input id="aiAccessToken" type="password" autocomplete="off" placeholder="Cloudflare access key">
              <label class="ai-auto-sync-toggle" for="aiAutoSync">
                <input id="aiAutoSync" type="checkbox">
                <span>Automatic sync</span>
              </label>
              <div class="ai-access-actions">
                <button class="metadata-button" id="aiPushButton" type="button">Send local data</button>
                <button class="metadata-button" id="aiPullButton" type="button">Load cloud data</button>
              </div>
              <p id="aiAccessStatus" role="status">Cloud sync is off.</p>
              <p>Keep this key private. MCP endpoint: <code id="aiMcpEndpoint"></code></p>
              <button class="metadata-button" id="copyMuseConfigButton" type="button">Copy Muse setup</button>
            </div>
          </details>
        </div>
      </header>

      <section class="view is-active" id="calendarView" aria-label="Calendar">
        <div class="calendar-layout" id="calendarLayout">
          <aside class="rail" aria-label="Tasks">
            <section class="card special-task-shelf" id="specialTaskShelf" aria-label="Special tasks">
              <header class="card-head">
                <h2>Special tasks</h2>
                <span class="card-hint">Drag onto a day</span>
                <button class="display-switch special-task-display-switch" id="specialTaskToggle" type="button" aria-label="Hide special tasks" aria-pressed="true"></button>
              </header>
              <div class="special-task-shelf-content">
                <div class="special-task-list" id="specialTaskList"></div>
                <button class="special-task-add" id="addSpecialTaskButton" type="button" aria-label="Add special task" title="New special task">+</button>
              </div>
            </section>

            <section class="card day-card" aria-label="Selected day tasks">
              <header class="card-head">
                <div class="card-title-stack">
                  <span class="card-eyebrow" id="selectedDayEyebrow">Today</span>
                  <h2 id="selectedDayTitle"></h2>
                </div>
                <button class="display-switch emoji-display-switch" id="emojiToggle" type="button" aria-label="Hide emoji markers" aria-pressed="true" title="Day markers"></button>
              </header>
              <div class="emoji-section" id="emojiSection" aria-label="Day emoji markers">
                <div class="emoji-palette" id="emojiPalette"></div>
              </div>
              <form id="calendarNoteForm" class="task-entry-form">
                <input id="calendarNoteInput" type="text" placeholder="Add a task" aria-label="Add daily task">
              </form>
              <div class="mini-list" id="selectedDateNotes" data-empty="No tasks yet"></div>
            </section>

            <section class="card info-dump-panel" aria-label="Info Dump">
              <header class="card-head">
                <h2>Info dump</h2>
                <span class="card-hint">Drag onto a day</span>
              </header>
              <form id="infoDumpForm" class="task-entry-form">
                <input id="infoDumpInput" type="text" placeholder="Add a note" aria-label="Add info dump task">
              </form>
              <div class="mini-list info-dump-list" id="infoDumpList"></div>
            </section>
          </aside>

          <section class="card calendar-panel" id="calendarPanel" aria-label="Calendar">
            <div class="calendar-panel-top">
              <div class="calendar-nav-buttons" aria-label="Calendar navigation">
                <button class="icon-quiet-button calendar-arrow-button" type="button" id="calendarPrevButton" aria-label="Previous calendar range">‹</button>
                <button class="icon-quiet-button calendar-arrow-button" type="button" id="calendarNextButton" aria-label="Next calendar range">›</button>
              </div>
              <div class="calendar-title-wrap">
                <button class="calendar-title" type="button" id="calendarTitleButton" title="Jump to a date">
                  <span id="calendarTitle"></span>
                </button>
                <input class="native-picker-input" id="selectedDatePicker" type="date" tabindex="-1" aria-hidden="true">
              </div>
              <button class="quiet-button" type="button" id="todayButton">Today</button>
              <div class="range-switch" aria-label="Calendar range">
                <button class="range-button is-active" type="button" data-range="week">Week</button>
                <button class="range-button" type="button" data-range="month">Month</button>
              </div>
              <details class="entry-menu calendar-more-menu">
                <summary aria-label="More calendar options" title="More">⋯</summary>
                <div class="entry-menu-items">
                  <button class="danger-text" type="button" id="calendarRemoveOldDataButton">Remove old data…</button>
                </div>
              </details>
            </div>
            <div class="special-task-tracker-area" id="specialTaskTrackerArea">
              <span class="tracker-label">Completed</span>
              <button class="display-switch special-task-tracker-toggle" id="specialTaskTrackerToggle" type="button" aria-label="Hide task counts" aria-pressed="true"></button>
              <div class="special-task-tracker" id="specialTaskTracker" aria-label="Special task counts"></div>
            </div>
            <div class="weekday-row" id="weekdayRow"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </section>

          <section class="card time-panel" id="timePanel" aria-label="Focus timer">
            <header class="card-head time-panel-head">
              <h2 class="time-panel-title">Focus</h2>
              <div class="range-switch time-chart-mode-toggle" role="tablist" aria-label="Timer view">
                <button class="range-button is-active" type="button" id="timeChartModeMergedButton" role="tab">Timer</button>
                <button class="range-button" type="button" id="timeChartModeSequenceButton" role="tab">History</button>
              </div>
              <button class="icon-quiet-button time-panel-toggle" id="timePanelToggle" type="button" aria-label="Close timer">›</button>
            </header>

            <div class="timer-session" id="timerSession">
              <div class="timer-ring" id="timerDisplay" data-status="idle">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="timer-ring-track" cx="60" cy="60" r="52" fill="none"></circle>
                  <circle class="timer-ring-progress" id="timerRingProgress" cx="60" cy="60" r="52" fill="none" transform="rotate(-90 60 60)"></circle>
                </svg>
                <div class="timer-ring-center">
                  <span class="timer-ring-task" id="timerRingTask"></span>
                  <span class="timer-ring-time" id="timerTimeText" aria-hidden="true">00:00</span>
                  <span class="timer-ring-sub" id="timerRingSub">Ready</span>
                  <span class="sr-only" id="timerStatusText" aria-live="polite">Timer idle</span>
                </div>
              </div>

              <div class="timer-length-row" aria-label="Session length">
                <button class="timer-adjust-button" type="button" id="timerSubtractButton" aria-label="Subtract 5 minutes" title="−5 min">−</button>
                <div class="timer-presets" id="timerPresets"></div>
                <button class="timer-adjust-button" type="button" id="timerAddButton" aria-label="Add 5 minutes" title="+5 min">+</button>
              </div>

              <div class="timer-task-picker">
                <span class="timer-field-label">Tracking</span>
                <div class="timer-task-chips" id="timerTaskChips"></div>
                <select class="sr-only" id="timerTaskSelect" aria-label="Task to track" tabindex="-1"></select>
              </div>

              <div class="timer-buttons">
                <button class="primary-button timer-main-button" type="button" id="timerStartButton">Start</button>
                <button class="primary-button timer-main-button" type="button" id="timerPauseButton" hidden>Pause</button>
                <button class="ghost-button timer-main-button" type="button" id="timerStopButton" hidden>Stop</button>
              </div>
              <div class="timer-finished" id="timerFinishedControls" hidden>
                <span>Time is up!</span>
                <button class="ghost-button" type="button" id="timerContinueButton">Continue</button>
                <button class="primary-button" type="button" id="timerEndButton">End</button>
              </div>
              <div class="timer-stop-confirm" id="timerStopConfirm" hidden>
                <span>Save tracked time?</span>
                <button class="primary-button" type="button" id="timerStopSaveButton">Save</button>
                <button class="ghost-button" type="button" id="timerStopResumeButton">Keep going</button>
                <button class="ghost-button danger-text" type="button" id="timerStopDiscardButton">Discard</button>
              </div>
            </div>

            <div class="time-today" id="timeChartArea">
              <div class="time-today-head">
                <span class="timer-field-label" id="timeTodayLabel">Tracked</span>
                <strong class="time-chart-total" id="timeChartTotal">0m</strong>
                <button class="quiet-button time-clear-button" type="button" id="clearTimeEntriesButton" hidden>Clear</button>
              </div>
              <div class="time-bar" id="timeBar" role="img" aria-label="No time tracked"></div>
              <div class="time-legend" id="timeLegend"></div>
            </div>

            <div class="time-sequence-list" id="timeSequenceList" hidden></div>
          </section>
        </div>
      </section>

      <section class="view" id="goalsView" aria-label="Goals">
        <div class="goals-layout">
          <div class="goal-group-tabs" id="goalGroupTabs" aria-label="Goal areas"></div>
          <div class="goal-sections" id="goalSections"></div>
        </div>
      </section>

      <section class="view" id="journalView" aria-label="Journal and gratefulness">
        <div class="journal-layout" id="journalLayout">
          <form id="journalForm" class="journal-form" aria-label="New journal entry">
            <button class="entry-panel-toggle" id="journalEntryToggle" type="button" aria-label="Close entry box">‹</button>
            <div class="journal-meta">
              <label>
                <span>City</span>
                <input id="journalCity" type="text" placeholder="Hanoi">
              </label>
              <label>
                <span>Date</span>
                <div class="picker-input-row">
                  <input id="journalDate" type="text" inputmode="numeric" maxlength="10" placeholder="yyyy-mm-dd">
                  <button class="picker-open-button" id="journalDatePickerButton" type="button" aria-label="Open date picker">▦</button>
                  <input class="native-picker-input" id="journalDatePicker" type="date" tabindex="-1" aria-hidden="true">
                </div>
              </label>
              <label>
                <span>Time</span>
                <input id="journalTime" type="text" inputmode="numeric" maxlength="5" placeholder="hh:mm">
              </label>
            </div>
            <div class="journal-label-row">
              <label>
                <span>Label</span>
                <select id="journalLabel"></select>
              </label>
              <details class="entry-menu label-menu">
                <summary aria-label="Label options">...</summary>
                <div class="entry-menu-items">
                  <button id="addJournalLabelButton" type="button">Add label</button>
                  <button class="danger-text" id="removeJournalLabelButton" type="button">Remove label</button>
                </div>
              </details>
            </div>
            <label>
              <span>Entry</span>
              <textarea id="journalText" rows="10"></textarea>
            </label>
            <div class="journal-form-actions">
              <button class="primary-button" id="journalSubmitButton" type="submit">Save entry</button>
              <button class="ghost-button" id="cancelJournalEditButton" type="button" hidden>Cancel edit</button>
            </div>
          </form>

          <div class="journal-resize-handle" id="journalResizeHandle" role="separator" aria-label="Resize saved journal" aria-orientation="vertical"></div>

          <aside class="log-panel" aria-label="Saved journal entries">
            <div class="log-head">
              <div class="journal-filter-controls">
                <label>
                  <span>Date</span>
                  <div class="picker-input-row">
                    <input id="journalFilterDate" type="text" inputmode="numeric" maxlength="10" placeholder="yyyy-mm-dd">
                    <button class="picker-open-button" id="journalFilterDatePickerButton" type="button" aria-label="Open saved journal date picker">▦</button>
                    <input class="native-picker-input" id="journalFilterDatePicker" type="date" tabindex="-1" aria-hidden="true">
                  </div>
                </label>
                <label>
                  <span>Month</span>
                  <select id="journalFilterMonth"></select>
                </label>
                <label>
                  <span>Year</span>
                  <input id="journalFilterYear" type="number" min="1970" max="2099" inputmode="numeric">
                </label>
                <label>
                  <span>Label</span>
                  <select id="journalFilterLabel"></select>
                </label>
                <button class="metadata-button" type="button" id="resetJournalFiltersButton">Reset</button>
                <button class="metadata-button" type="button" id="exportJournalBackupButton">Save backup</button>
                <button class="metadata-button" type="button" id="importJournalBackupButton">Load backup</button>
                <button class="cleanup-button" type="button" id="removeOldDataButton">Remove old data</button>
              </div>
            </div>
            <div class="journal-log" id="journalLog"></div>
          </aside>
        </div>
      </section>
    </main>

    <template id="goalSectionTemplate">
      <article class="goal-section">
        <header>
          <span class="goal-section-drag-handle" aria-label="Drag goal box" role="button" tabindex="0"></span>
          <textarea class="section-title-input" rows="1" aria-label="Goal section title"></textarea>
          <details class="goal-section-move-menu"></details>
          <button class="icon-button danger" type="button" data-action="delete-section" aria-label="Delete section">x</button>
        </header>
        <form class="goal-form">
          <input type="text" placeholder="Add a goal">
        </form>
        <ul class="goal-list"></ul>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
