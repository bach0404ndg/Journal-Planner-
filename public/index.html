<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monthly Planner Journal</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>YOUR PLANNER</h1>
        </div>
      </header>

      <div class="section-switcher">
        <nav class="tabs" aria-label="Planner sections">
          <button class="tab is-active" type="button" data-view="calendar">Calendar</button>
          <button class="tab" type="button" data-view="goals">Goals</button>
          <button class="tab" type="button" data-view="journal">Journal</button>
        </nav>
        <div class="section-meta-controls">
          <button class="undo-button" type="button" id="undoButton" disabled>Undo</button>
          <details class="palette-control color-menu" id="paletteMenu">
            <summary aria-label="Choose planner color">
              <span class="color-menu-current" aria-hidden="true"></span>
            </summary>
            <div class="color-menu-items" id="paletteOptions"></div>
          </details>
        </div>
      </div>

      <section class="view is-active" id="calendarView" aria-label="Calendar">
        <div class="calendar-layout">
          <aside class="side-panel" aria-label="Calendar task editor">
            <div class="side-panel-split">
              <div class="side-panel-main">
                <div class="calendar-date-controls" aria-label="Calendar date controls">
                  <label>
                    <span>Date</span>
                    <div class="picker-input-row">
                      <input id="selectedDateInput" type="text" inputmode="numeric" maxlength="10" placeholder="yyyy-mm-dd">
                      <button class="picker-open-button" id="selectedDatePickerButton" type="button" aria-label="Open calendar date picker">▦</button>
                      <input class="native-picker-input" id="selectedDatePicker" type="date" tabindex="-1" aria-hidden="true">
                    </div>
                  </label>
                  <label>
                    <span>Month</span>
                    <select id="monthSelect"></select>
                  </label>
                  <label>
                    <span>Year</span>
                    <input id="yearInput" type="number" min="1970" max="2099" inputmode="numeric">
                  </label>
                  <button class="ghost-button" type="button" id="todayButton">Today</button>
                  <button class="cleanup-button" type="button" id="calendarRemoveOldDataButton">Remove old data</button>
                </div>
                <div class="emoji-section" aria-label="Day emoji markers">
                  <div class="emoji-palette" id="emojiPalette"></div>
                </div>
                <div class="side-panel-tasks">
                  <form id="calendarNoteForm" class="stacked-form">
                    <div class="special-task-shelf" aria-label="Special calendar tasks">
                      <button class="special-task-add" id="addSpecialTaskButton" type="button" aria-label="Add special task">+</button>
                      <div class="special-task-list" id="specialTaskList"></div>
                    </div>
                    <label>
                      <span>Task</span>
                      <input id="calendarNoteInput" type="text" placeholder="Add a task and press Enter">
                    </label>
                  </form>
                  <div class="mini-list" id="selectedDateNotes"></div>
                </div>
              </div>

              <section class="time-panel" aria-label="Time tracking">
                <div class="time-panel-head">
                  <h2 class="time-panel-title">Time Pie</h2>
                  <button class="cleanup-button time-clear-button" type="button" id="clearTimeEntriesButton" hidden>Clear</button>
                </div>

                <div class="range-switch time-chart-mode-toggle" role="tablist" aria-label="Pie chart arrangement">
                  <button class="range-button is-active" type="button" id="timeChartModeMergedButton" role="tab">Merged</button>
                  <button class="range-button" type="button" id="timeChartModeSequenceButton" role="tab">Sequence</button>
                </div>

                <div class="time-chart-area">
                  <div class="time-chart">
                    <svg id="timePieChart" viewBox="0 0 120 120" role="img" aria-label="Tracked time pie chart">
                      <circle class="time-chart-track" cx="60" cy="60" r="45" fill="none"></circle>
                      <g id="timePieSlices"></g>
                    </svg>
                    <div class="time-chart-center">
                      <span class="time-chart-total" id="timeChartTotal">0h 0m</span>
                    </div>
                  </div>
                </div>

                <div class="timer-controls">
                  <div class="range-switch time-view-toggle" role="tablist" aria-label="Time panel view">
                    <button class="range-button" type="button" id="timeViewLegendButton" role="tab">Legend</button>
                    <button class="range-button is-active" type="button" id="timeViewTimerButton" role="tab">Timer</button>
                  </div>

                  <div class="time-legend" id="timeLegend" hidden></div>

                  <div class="time-legend-add" id="timeLegendAdd" hidden>
                    <select id="legendAddTaskSelect" aria-label="Task to add tracked time for"></select>
                    <div class="duration-mask time-legend-duration" id="legendAddDurationMask">
                      <input id="legendAddDurationHours" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="Hours to add">
                      <span class="duration-mask-unit">h</span>
                      <input id="legendAddDurationMinutes" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="Minutes to add">
                      <span class="duration-mask-unit">m</span>
                    </div>
                    <button class="time-legend-add-button" type="button" id="legendAddButton" aria-label="Add tracked time">+</button>
                  </div>

                  <div class="timer-session" id="timerSession">
                    <div class="timer-row">
                      <label>
                        <span>Track</span>
                        <select id="timerTaskSelect" aria-label="Task to track"></select>
                      </label>
                      <label class="timer-duration-field">
                        <span>Duration</span>
                        <div class="duration-mask" id="timerDurationMask">
                          <input id="timerDurationMinutes" type="text" inputmode="numeric" maxlength="2" value="25" aria-label="Minutes">
                          <span class="duration-mask-unit">m</span>
                        </div>
                      </label>
                    </div>
                    <div class="timer-display-row">
                      <button class="timer-adjust-button" type="button" id="timerSubtractButton" aria-label="Subtract 5 minutes" hidden>−</button>
                      <div class="timer-display" id="timerDisplay">
                        <span id="timerTimeText" aria-hidden="true">00:00</span>
                        <span class="sr-only" id="timerStatusText" aria-live="polite">Timer idle</span>
                      </div>
                      <button class="timer-adjust-button" type="button" id="timerAddButton" aria-label="Add 5 minutes" hidden>+</button>
                    </div>
                    <div class="timer-buttons">
                      <button class="primary-button" type="button" id="timerStartButton">Start</button>
                      <button class="ghost-button" type="button" id="timerPauseButton" hidden>Pause</button>
                      <button class="ghost-button" type="button" id="timerStopButton" hidden>Stop</button>
                    </div>
                    <div class="timer-finished" id="timerFinishedControls" hidden>
                      <span>Time is up!</span>
                      <button class="ghost-button" type="button" id="timerContinueButton">Continue</button>
                      <button class="primary-button" type="button" id="timerEndButton">End</button>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </aside>

          <section class="calendar-panel" aria-label="Monthly calendar">
            <div class="calendar-panel-top">
              <div class="range-switch" aria-label="Calendar range">
                <button class="range-button" type="button" data-range="month">Monthly</button>
                <button class="range-button is-active" type="button" data-range="week">Weekly</button>
              </div>
              <div class="special-task-tracker" id="specialTaskTracker" aria-label="Special task counts"></div>
              <div class="calendar-nav-buttons" aria-label="Calendar navigation">
                <button class="metadata-button calendar-arrow-button" type="button" id="calendarPrevButton" aria-label="Previous calendar range">&lt;</button>
                <button class="metadata-button calendar-arrow-button" type="button" id="calendarNextButton" aria-label="Next calendar range">&gt;</button>
              </div>
            </div>
            <div class="weekday-row" id="weekdayRow"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </section>
        </div>
      </section>

      <section class="view" id="goalsView" aria-label="Goals">
        <div class="goals-layout">
          <div class="goal-group-tabs" id="goalGroupTabs" aria-label="Goal areas"></div>
          <div class="goal-sections" id="goalSections"></div>
        </div>
      </section>

      <section class="view" id="journalView" aria-label="Journal and gratefulness">
        <div class="journal-layout" id="journalLayout">
          <form id="journalForm" class="journal-form" aria-label="New journal entry">
            <button class="entry-panel-toggle" id="journalEntryToggle" type="button" aria-label="Close entry box">‹</button>
            <div class="journal-meta">
              <label>
                <span>City</span>
                <input id="journalCity" type="text" placeholder="Hanoi">
              </label>
              <label>
                <span>Date</span>
                <div class="picker-input-row">
                  <input id="journalDate" type="text" inputmode="numeric" maxlength="10" placeholder="yyyy-mm-dd">
                  <button class="picker-open-button" id="journalDatePickerButton" type="button" aria-label="Open date picker">▦</button>
                  <input class="native-picker-input" id="journalDatePicker" type="date" tabindex="-1" aria-hidden="true">
                </div>
              </label>
              <label>
                <span>Time</span>
                <input id="journalTime" type="text" inputmode="numeric" maxlength="5" placeholder="hh:mm">
              </label>
            </div>
            <div class="journal-label-row">
              <label>
                <span>Label</span>
                <select id="journalLabel"></select>
              </label>
              <details class="entry-menu label-menu">
                <summary aria-label="Label options">...</summary>
                <div class="entry-menu-items">
                  <button id="addJournalLabelButton" type="button">Add label</button>
                  <button class="danger-text" id="removeJournalLabelButton" type="button">Remove label</button>
                </div>
              </details>
            </div>
            <label>
              <span>Entry</span>
              <textarea id="journalText" rows="10"></textarea>
            </label>
            <div class="journal-form-actions">
              <button class="primary-button" id="journalSubmitButton" type="submit">Save entry</button>
              <button class="ghost-button" id="cancelJournalEditButton" type="button" hidden>Cancel edit</button>
            </div>
          </form>

          <div class="journal-resize-handle" id="journalResizeHandle" role="separator" aria-label="Resize saved journal" aria-orientation="vertical"></div>

          <aside class="log-panel" aria-label="Saved journal entries">
            <div class="log-head">
              <div class="journal-filter-controls">
                <label>
                  <span>Date</span>
                  <div class="picker-input-row">
                    <input id="journalFilterDate" type="text" inputmode="numeric" maxlength="10" placeholder="yyyy-mm-dd">
                    <button class="picker-open-button" id="journalFilterDatePickerButton" type="button" aria-label="Open saved journal date picker">▦</button>
                    <input class="native-picker-input" id="journalFilterDatePicker" type="date" tabindex="-1" aria-hidden="true">
                  </div>
                </label>
                <label>
                  <span>Month</span>
                  <select id="journalFilterMonth"></select>
                </label>
                <label>
                  <span>Year</span>
                  <input id="journalFilterYear" type="number" min="1970" max="2099" inputmode="numeric">
                </label>
                <label>
                  <span>Label</span>
                  <select id="journalFilterLabel"></select>
                </label>
                <button class="metadata-button" type="button" id="resetJournalFiltersButton">Reset</button>
                <button class="cleanup-button" type="button" id="removeOldDataButton">Remove old data</button>
              </div>
            </div>
            <div class="journal-log" id="journalLog"></div>
          </aside>
        </div>
      </section>
    </main>

    <template id="goalSectionTemplate">
      <article class="goal-section">
        <header>
          <span class="goal-section-drag-handle" aria-label="Drag goal box" role="button" tabindex="0"></span>
          <textarea class="section-title-input" rows="1" aria-label="Goal section title"></textarea>
          <details class="goal-section-move-menu"></details>
          <button class="icon-button danger" type="button" data-action="delete-section" aria-label="Delete section">x</button>
        </header>
        <form class="goal-form">
          <input type="text" placeholder="Add a goal and press Enter">
        </form>
        <ul class="goal-list"></ul>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
